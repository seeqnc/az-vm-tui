[project]
name = "azure-vm-tui"
version = "0.1.0"
description = "Fast TUI for listing, starting, stopping, and inspecting Azure VMs"
readme = "TLDR.md"
requires-python = ">=3.11"
authors = [{ name = "Azure VM TUI Contributors" }]
keywords = ["azure", "vm", "tui", "textual", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "textual>=0.60",
    "paramiko>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/yourorg/azure-vm-tui"
Issues = "https://github.com/yourorg/azure-vm-tui/issues"

[project.scripts]
azure-vm-tui = "azure_vm_tui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_vm_tui"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
